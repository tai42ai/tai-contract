name: Bug report
description: Report a defect in tai42-contract (pure interface contracts — protocols, ABCs, pydantic models)
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal steps or code that reproduce the problem (e.g. an import that fails, a model that won't rebuild, a protocol/type mismatch flagged by pyright).
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: tai42-contract version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, pydantic version, and (for type-checking issues) pyright version and relevant vendor libs.
      placeholder: "Python 3.13.x, macOS 15, pydantic 2.x"
    validations:
      required: true
